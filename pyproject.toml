[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-framework"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "codex-backend-sdk>=0.5.3",
    "fastapi",
    "httpx",
    "jsonschema>=4.26.0",
    "modict>=0.4.19",
    "pillow",
    "playwright",
    "python-multipart",
    "pyyaml",
    "tiktoken",
    "uvicorn",
    "websockets",
]

[project.optional-dependencies]
dev = ["httpx2>=2.0.0", "pytest"]

[project.scripts]
the-framework = "the_framework.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["the_framework"]
force-include = { "starter" = "the_framework/_starter" }
exclude = ["/starter/ui/dist/**", "/starter/ui/node_modules/**", "**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
