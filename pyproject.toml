[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "b4pt0r-the-framework"
version = "0.2.0"
description = "Build persistent, extensible local agent applications with supervised workers and authenticated clients"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "B4PT0R" }]
keywords = ["agents", "agentic-applications", "framework", "fastapi", "plugins"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "codex-backend-sdk>=0.5.3",
    "fastapi",
    "httpx",
    "jsonschema>=4.26.0",
    "modict>=0.4.19",
    "pillow",
    "playwright",
    "python-multipart",
    "pyyaml",
    "tiktoken",
    "uvicorn",
    "websockets",
]

[project.optional-dependencies]
dev = ["httpx2>=2.0.0", "pytest"]

[project.scripts]
the-framework = "the_framework.cli:main"

[project.urls]
Homepage = "https://github.com/B4PT0R/the_framework"
Documentation = "https://github.com/B4PT0R/the_framework/blob/main/README.md"
Repository = "https://github.com/B4PT0R/the_framework"
Changelog = "https://github.com/B4PT0R/the_framework/blob/main/CHANGELOG.md"
Issues = "https://github.com/B4PT0R/the_framework/issues"

[tool.hatch.build.targets.wheel]
packages = ["the_framework"]
force-include = { "starter" = "the_framework/_starter" }
exclude = ["/starter/ui/dist/**", "/starter/ui/node_modules/**", "**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
